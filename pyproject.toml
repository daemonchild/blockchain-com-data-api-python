[project]
name = "bcda"
version = "0.1.1"
authors = [
  { name="daemonchild", email="tom@daemonchild.com" },
]
description = "Python Wrapper for the BlockChain.com Data API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.32.0",
  "urllib3>=2.5.0",
  "colorama"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/daemonchild/blockchain-com-data-api-python"
Issues = "https://github.com/daemonchild/blockchain-com-data-api-python/issues"


[tool.setuptools.packages.find]
where = ["src"]
include = ["bcda*"]

